<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motorhome OS | Oficina</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8eef7;background:#0b1220}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#111c2f;padding:24px 14px;border-right:1px solid #26364e}aside h2{margin:4px 12px 26px;font-size:20px}.nav{display:block;width:100%;text-align:left;border:0;border-radius:10px;padding:12px;margin:4px 0;background:transparent;color:#bdcbe0}.nav.active,.nav:hover{background:#1e3555;color:white}main{padding:28px;max-width:1200px;width:100%;margin:auto}h1{font-size:26px;margin:0 0 6px}h3{margin:0 0 16px}.muted{color:#9caec7}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.panel,.stat{background:#142239;border:1px solid #29405e;border-radius:16px;padding:20px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat b{font-size:29px;display:block;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#c4d3e5;margin-bottom:12px}input,select,textarea{width:100%;border:1px solid #38516f;border-radius:9px;padding:11px;background:#0c1729;color:#f5f8ff;min-height:42px}textarea{min-height:76px}button.primary{background:#1685ed;color:white;border:0;border-radius:9px;padding:11px 17px;font-weight:650}button.secondary{background:#243c5b;color:#fff;border:1px solid #39587b;border-radius:9px;padding:10px 13px}button.danger{background:#6a2736;color:#fff;border:0;border-radius:9px;padding:10px 13px}.actions{display:flex;flex-wrap:wrap;gap:8px}.item{border:1px solid #304865;border-radius:10px;padding:13px;margin-bottom:9px;display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{border-radius:20px;background:#26415e;color:#b8e2ff;padding:5px 9px;font-size:12px}.hidden{display:none!important}.checkrow{display:grid;grid-template-columns:minmax(150px,1fr) 170px minmax(150px,1fr);gap:10px;align-items:center;border-bottom:1px solid #30435d;padding:10px 0}.checkrow input,.checkrow select{margin:0}.line{display:grid;grid-template-columns:2fr 75px 110px 110px 42px;gap:8px;margin-bottom:8px;align-items:center}.tot{font-size:24px;text-align:right;margin:15px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{background:#223754;color:white;border:1px solid #365473;border-radius:8px;padding:9px}.tabs button.active{background:#1379d1}.notice{background:#273e5b;border-radius:10px;padding:12px;color:#d4e8ff;margin:12px 0;font-size:13px}.empty{padding:26px;text-align:center;color:#a9b9ce}small{color:#9cb0c8}@media(max-width:760px){.shell{display:block}aside{padding:12px;position:sticky;top:0;z-index:3}aside h2{margin:0 0 9px;font-size:16px}.navs{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto;padding:9px}.top{align-items:flex-start}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:12px}.stat b{font-size:22px}main{padding:16px}.grid{grid-template-columns:1fr}.checkrow{grid-template-columns:1fr 1fr}.checkrow strong{grid-column:1/-1}.checkrow input{grid-column:1/-1}.line{grid-template-columns:1fr 65px 80px 32px}.line .subtotal{display:none}}
@media print{body{background:white;color:black}.shell{display:block}aside,.no-print,.tabs{display:none!important}main{padding:0}.panel{background:white;color:black;border:1px solid #bbb}.muted,small{color:#444}input,textarea,select{color:black;border:0;background:white}button{display:none}.checkrow{border-color:#ddd}.pill{color:black;background:#eee}}
</style></head><body><div class="shell"><aside><h2>🚐 Motorhome OS</h2><div class="navs"><button class="nav active" data-view="dashboard">▦ Painel</button><button class="nav" data-view="clientes">♙ Clientes</button><button class="nav" data-view="veiculos">🚐 Veículos</button><button class="nav" data-view="ordens">☷ Ordens de serviço</button><button class="nav" data-view="backup">⇩ Backup</button></div></aside><main id="app"></main></div><script>
const KEY='motorhome-os-v1';const fresh=()=>({clientes:[],veiculos:[],ordens:[],seq:0});let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}let view='dashboard',current=null,tab='entrada';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('Dados mantidos somente nesta sessão:',e)}};const id=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+'-'+Math.random().toString(36).slice(2);const find=(type,k)=>db[type].find(x=>x.id===k);const title=(a,b='')=>`<div class="top"><div><h1>${a}</h1><div class="muted">${b}</div></div></div>`;const field=(label,name,type='text',value='',extra='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;const opts=(arr,selected='')=>arr.map(([v,l])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(l)}</option>`).join('');const choices=(type,placeholder)=>`<option value="">${placeholder}</option>`+db[type].map(x=>`<option value="${x.id}">${esc(type==='clientes'?x.nome:(x.placa+' — '+x.modelo))}</option>`).join('');
const groups={entrada:{'Condições gerais':['Lataria e avarias','Vidros e retrovisores','Iluminação externa','Quilometragem registrada','Acessórios recebidos'],'Sistema elétrico':['Bateria de partida','Bateria auxiliar','Iluminação interna','Tomadas','Inversor','Painéis solares','Carregador de baterias']},diagnostico:{'Testes e medições':['Bateria de partida','Bateria auxiliar','Alternador','Conversor DC-DC','Inversor','Controlador solar','Fusíveis e proteções','Circuitos e tomadas']},saida:{'Verificação final':['Serviços executados conferidos','Baterias e carregamento','Iluminação e tomadas','Inversor e energia solar','Proteções elétricas','Acessórios devolvidos','Condições de entrega']}};
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));let a=$('#app');if(view==='dashboard'){let abertas=db.ordens.filter(o=>!['Entregue','Cancelada'].includes(o.status));a.innerHTML=title('Painel da oficina','Visão geral das ordens de serviço')+`<div class="stats"><div class="stat"><b>${db.ordens.length}</b><small>OS registradas</small></div><div class="stat"><b>${abertas.length}</b><small>Em aberto</small></div><div class="stat"><b>${db.ordens.filter(o=>o.status==='Entregue').length}</b><small>Entregues</small></div></div><div class="panel"><div class="top"><h3>Ordens recentes</h3><button class="primary" onclick="go('ordens')">Ver ordens</button></div>${db.ordens.slice().reverse().slice(0,8).map(o=>orderItem(o)).join('')||'<div class="empty">Nenhuma OS cadastrada ainda.</div>'}</div>`}if(view==='clientes'){a.innerHTML=title('Clientes','Cadastro de proprietários e contatos')+`<div class="panel"><h3>Novo cliente</h3><form id="clientForm"><div class="grid">${field('Nome / Razão social','nome','text','','required')}${field('CPF / CNPJ','documento')}${field('WhatsApp','telefone','tel')}${field('E-mail','email','email')}</div><button class="primary">Salvar cliente</button></form></div><div class="panel"><h3>Clientes cadastrados</h3>${db.clientes.map(c=>`<div class="item"><div><b>${esc(c.nome)}</b><br><small>${esc(c.telefone)} · ${esc(c.documento)}</small></div></div>`).join('')||'<div class="empty">Nenhum cliente cadastrado.</div>'}</div>`;$('#clientForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.clientes.push({id:id(),...Object.fromEntries(f)});save();render()}}if(view==='veiculos'){a.innerHTML=title('Veículos','Motorhomes vinculados aos clientes')+`<div class="panel"><h3>Novo veículo</h3>${db.clientes.length?'':'<div class="notice">Primeiro cadastre um cliente na aba Clientes ou use o cadastro rápido na aba Ordens de serviço.</div>'}<form id="vehicleForm"><label class="field">Proprietário<select name="clienteId" required>${choices('clientes','Selecione um cliente')}</select></label><div class="grid">${field('Placa','placa','text','','required')}${field('Marca','marca')}${field('Modelo','modelo','text','','required')}${field('Ano','ano','number')}${field('Chassi (opcional)','chassi')}${field('Quilometragem','km','number')}</div><button class="primary">Salvar veículo</button></form></div><div class="panel"><h3>Veículos cadastrados</h3>${db.veiculos.map(v=>`<div class="item"><div><b>${esc(v.marca)} ${esc(v.modelo)}</b> · ${esc(v.placa)}<br><small>${esc(find('clientes',v.clienteId)?.nome||'Cliente não localizado')}</small></div></div>`).join('')||'<div class="empty">Nenhum veículo cadastrado.</div>'}</div>`;$('#vehicleForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.veiculos.push({id:id(),...Object.fromEntries(f)});save();render()}}if(view==='ordens'){a.innerHTML=title('Ordens de serviço','Entrada, diagnóstico, orçamento e saída')+`<div class="panel no-print"><h3>Abrir nova OS</h3><div class="notice">Ainda não cadastrou o veículo? Use o cadastro rápido abaixo e depois abra a OS.</div><div class="actions" style="margin-bottom:15px"><button class="secondary" type="button" onclick="quickRegister()">+ Cadastrar cliente e veículo</button></div><form id="orderForm"><label class="field">Veículo<select name="veiculoId" required>${choices('veiculos','Selecione um veículo')}</select></label><div class="grid">${field('Técnico responsável','tecnico','text','','required')}${field('Quilometragem de entrada','km','number')}</div><label class="field">Reclamação do cliente<textarea name="reclamacao" required></textarea></label><button class="primary">Criar ordem de serviço</button></form></div><div class="panel"><h3>Ordens cadastradas</h3>${db.ordens.slice().reverse().map(o=>orderItem(o)).join('')||'<div class="empty">Nenhuma ordem aberta.</div>'}</div>`;$('#orderForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.seq++;let o={id:id(),numero:db.seq,criada:new Date().toISOString(),status:'Aberta',...Object.fromEntries(f),checklists:{entrada:{},diagnostico:{},saida:{}},itens:[],desconto:0,aprovacao:'Pendente',observacoes:'',diagnosticoTexto:''};db.ordens.push(o);save();openOrder(o.id)}}if(view==='detalhe')renderOrder();if(view==='backup'){a.innerHTML=title('Backup e restauração','Seus dados estão armazenados neste navegador')+`<div class="panel"><h3>Proteja os registros da oficina</h3><p>Exporte regularmente um arquivo JSON e guarde-o em local seguro. O arquivo contém dados pessoais de clientes.</p><div class="actions"><button class="primary" onclick="exportBackup()">Baixar backup JSON</button><label class="secondary" style="cursor:pointer;padding:10px;border-radius:9px">Importar backup<input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importBackup(event)"></label></div><div class="notice">A importação substitui os dados locais. Não há sincronização automática entre dispositivos nesta versão.</div></div>`}}
function quickRegister(){
 let nome=prompt('Nome do cliente:');if(!nome?.trim())return;
 let placa=prompt('Placa do motorhome (ou identificação):');if(!placa?.trim())return;
 let modelo=prompt('Modelo do motorhome (ex.: Sprinter):');if(!modelo?.trim())return;
 let cliente={id:id(),nome:nome.trim(),documento:'',telefone:'',email:''};
 let veiculo={id:id(),clienteId:cliente.id,placa:placa.trim().toUpperCase(),marca:'',modelo:modelo.trim(),ano:'',chassi:'',km:''};
 db.clientes.push(cliente);db.veiculos.push(veiculo);save();render();
 let sel=document.querySelector('#orderForm select[name="veiculoId"]');if(sel)sel.value=veiculo.id;
 alert('Cliente e motorhome cadastrados! Agora preencha a OS.');
}
function orderItem(o){let v=find('veiculos',o.veiculoId);return `<div class="item"><div><b>OS #${String(o.numero).padStart(5,'0')}</b> · ${esc(v?.modelo||'Veículo não encontrado')}<br><small>${esc(v?.placa||'')} · ${new Date(o.criada).toLocaleDateString('pt-BR')}</small></div><div class="actions"><span class="pill">${esc(o.status)}</span><button class="secondary" onclick="openOrder('${o.id}')">Abrir</button></div></div>`}function go(v){view=v;current=null;render();window.scrollTo(0,0)}function openOrder(i){current=i;view='detalhe';tab='entrada';render();window.scrollTo(0,0)}function active(){return find('ordens',current)}
function renderOrder(){let o=active();if(!o){go('ordens');return}let v=find('veiculos',o.veiculoId),c=find('clientes',v?.clienteId);$('#app').innerHTML=`<div class="top"><div><h1>OS #${String(o.numero).padStart(5,'0')}</h1><div class="muted">${esc(v?.marca)} ${esc(v?.modelo)} · ${esc(v?.placa)} · ${esc(c?.nome)}</div></div><button class="secondary no-print" onclick="go('ordens')">← Voltar</button></div><div class="panel"><div class="grid"><label class="field">Status<select id="status" onchange="updateOrder('status',this.value)">${opts(['Aberta','Em diagnóstico','Aguardando aprovação','Aguardando peças','Em execução','Conferência final','Entregue','Cancelada'].map(x=>[x,x]),o.status)}</select></label><label class="field">Técnico responsável<input value="${esc(o.tecnico)}" onchange="updateOrder('tecnico',this.value)"></label></div><p><b>Reclamação:</b> ${esc(o.reclamacao)}</p><small>Entrada: ${new Date(o.criada).toLocaleString('pt-BR')} · Km: ${esc(o.km||'Não informado')}</small></div><div class="tabs no-print">${[['entrada','1. Entrada'],['diagnostico','2. Diagnóstico'],['orcamento','3. Orçamento'],['saida','4. Saída'],['resumo','5. Resumo / PDF']].map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div><div id="detailBody"></div>`;renderTab()}
function setTab(t){tab=t;renderOrder()}function updateOrder(k,val){active()[k]=val;save()}function renderTab(){let o=active(),a=$('#detailBody');if(groups[tab]){let h=`<div class="panel"><h3>Checklist de ${tab==='entrada'?'entrada':tab==='saida'?'saída':'diagnóstico técnico'}</h3><div class="notice">Avalie cada item. As observações podem incluir medições em V, A ou Ω. Alterações são salvas automaticamente neste dispositivo.</div>`;for(let [g,items] of Object.entries(groups[tab])){h+=`<h3>${g}</h3>`;for(let item of items){let x=o.checklists[tab][item]||{};h+=`<div class="checkrow"><strong>${esc(item)}</strong><select onchange="setCheck('${tab}','${esc(item)}','status',this.value)">${opts([['','Não avaliado'],['Conforme','Conforme'],['Não conforme','Não conforme'],['N/A','Não se aplica'] ],x.status)}</select><input placeholder="Observação / medição" value="${esc(x.obs)}" onchange="setCheck('${tab}','${esc(item)}','obs',this.value)"></div>`}}h+='</div>';if(tab==='diagnostico')h+=`<div class="panel"><label class="field">Conclusão do diagnóstico<textarea onchange="updateOrder('diagnosticoTexto',this.value)">${esc(o.diagnosticoTexto)}</textarea></label></div>`;if(tab==='saida')h+=`<div class="panel"><label class="field">Observações finais / pendências<textarea onchange="updateOrder('observacoes',this.value)">${esc(o.observacoes)}</textarea></label></div>`;a.innerHTML=h;return}if(tab==='orcamento'){let sum=o.itens.reduce((s,x)=>s+(+x.qtd||0)*(+x.valor||0),0);a.innerHTML=`<div class="panel"><h3>Peças e mão de obra</h3><div id="lines">${o.itens.map((x,i)=>`<div class="line"><input aria-label="Descrição" value="${esc(x.descricao)}" placeholder="Descrição" onchange="setLine(${i},'descricao',this.value)"><input aria-label="Quantidade" type="number" min="0" step="0.01" value="${esc(x.qtd)}" onchange="setLine(${i},'qtd',this.value)"><input aria-label="Valor unitário" type="number" min="0" step="0.01" value="${esc(x.valor)}" onchange="setLine(${i},'valor',this.value)"><span class="subtotal">${money((+x.qtd||0)*(+x.valor||0))}</span><button class="danger" onclick="delLine(${i})">×</button></div>`).join('')}</div><button class="secondary" onclick="addLine()">+ Adicionar item</button><div class="grid" style="margin-top:16px"><label class="field">Desconto (R$)<input type="number" min="0" step="0.01" value="${esc(o.desconto)}" onchange="updateOrder('desconto',Math.max(0,+this.value||0));renderTab()"></label><label class="field">Aprovação do orçamento<select onchange="updateOrder('aprovacao',this.value)">${opts([['Pendente','Pendente'],['Aprovado','Aprovado'],['Recusado','Recusado']],o.aprovacao)}</select></label></div><div class="tot">Total: <b>${money(Math.max(0,sum-(+o.desconto||0)))}</b></div></div>`;return}if(tab==='resumo'){let v=find('veiculos',o.veiculoId),c=find('clientes',v?.clienteId),sum=o.itens.reduce((s,x)=>s+(+x.qtd||0)*(+x.valor||0),0);let h=`<div class="panel"><h3>Relatório da ordem de serviço</h3><p><b>Cliente:</b> ${esc(c?.nome)} · ${esc(c?.telefone)}<br><b>Veículo:</b> ${esc(v?.marca)} ${esc(v?.modelo)} · ${esc(v?.placa)}<br><b>Responsável:</b> ${esc(o.tecnico)}<br><b>Status:</b> ${esc(o.status)}<br><b>Reclamação:</b> ${esc(o.reclamacao)}</p>`;for(let t of ['entrada','diagnostico','saida']){h+=`<h3>${t==='entrada'?'Checklist de entrada':t==='saida'?'Checklist de saída':'Diagnóstico técnico'}</h3>`;let entries=Object.entries(o.checklists[t]).filter(([k,x])=>x.status||x.obs);h+=entries.map(([k,x])=>`<div style="margin-bottom:5px">${esc(k)}: ${esc(x.status||'Não avaliado')} ${x.obs?'— '+esc(x.obs):''}</div>`).join('')||'<small>Nenhum item avaliado.</small>'}h+=`<p><b>Conclusão técnica:</b> ${esc(o.diagnosticoTexto||'Não registrada')}</p><h3>Orçamento</h3>${o.itens.map(x=>`<div>${esc(x.descricao)} — ${esc(x.qtd)} × ${money(x.valor)} = ${money((+x.qtd||0)*(+x.valor||0))}</div>`).join('')}<p><b>Desconto:</b> ${money(o.desconto)}<br><b>Total:</b> ${money(Math.max(0,sum-(+o.desconto||0)))}<br><b>Aprovação:</b> ${esc(o.aprovacao)}</p><p><b>Observações finais:</b> ${esc(o.observacoes||'Nenhuma')}</p><div class="actions no-print"><button class="primary" onclick="window.print()">Imprimir / Salvar como PDF</button></div></div>`;a.innerHTML=h}}
function setCheck(t,item,k,val){let o=active();o.checklists[t][item]??={};o.checklists[t][item][k]=val;save()}function addLine(){active().itens.push({descricao:'',qtd:1,valor:0});save();renderTab()}function delLine(i){active().itens.splice(i,1);save();renderTab()}function setLine(i,k,v){active().itens[i][k]=v;save();renderTab()}function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='motorhome-os-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importBackup(e){let f=e.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.clientes)||!Array.isArray(data.veiculos)||!Array.isArray(data.ordens)||typeof data.seq!=='number')throw Error('Estrutura inválida');if(!confirm('Substituir TODOS os registros locais pelos dados do arquivo?'))return;db=data;save();go('dashboard');alert('Backup importado.')}catch(err){alert('Não foi possível importar: '+err.message)}}render();
</script></body></html>
